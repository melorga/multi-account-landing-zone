name: Deploy Multi-Account Landing Zone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Apply runs only when explicitly dispatched, so a routine push to
  # main cannot auto-mutate the organization.
  workflow_dispatch:

env:
  TF_VERSION: '1.15.1'
  AWS_REGION: 'us-east-1'

# Least-privilege defaults. `id-token: write` is required for the OIDC
# `aws-actions/configure-aws-credentials` exchange.
permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: write

# Serialise apply runs against the same ref. Plans run in parallel but
# never overlap an in-flight apply.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # `terraform fmt -check` already exits non-zero on diff and the
      # shell runs with `set -e` by default, so a follow-up `if [ $? ... ]`
      # is unreachable. Just let the failure propagate.
      - name: Terraform Format Check
        run: terraform fmt -check -recursive .

      - name: Terraform Init (Module)
        run: terraform init -backend=false
        working-directory: ./modules/landing-zone

      - name: Terraform Validate (Module)
        run: terraform validate
        working-directory: ./modules/landing-zone

      - name: Terraform Init (Example)
        run: terraform init -backend=false
        working-directory: ./examples/basic

      - name: Terraform Validate (Example)
        run: terraform validate
        working-directory: ./examples/basic

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # bridgecrewio/checkov-action@v12.1347.0 only declares `directory` /
      # `entryPoint` / `args` as inputs; the `output_format` /
      # `output_file_path` / `framework` / `soft_fail` keys we previously
      # passed are silently rejected by GitHub Actions ("Unexpected input(s)..."
      # warning, then a non-zero exit). Drop the action wrapper and run the
      # checkov CLI directly via pip so we have full control over flags
      # and the SARIF output path.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install "checkov>=3.2,<4.0"

      - name: Run Checkov scan
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --output sarif \
            --output-file-path . \
            --soft-fail
        # Checkov writes results_sarif.sarif into the working directory.

      - name: Upload Checkov scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results_sarif.sarif

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-validate, security-scan]
    # Skip when no AWS role is configured. Plan needs real backend +
    # provider access. Set the variable under Settings -> Secrets and
    # variables -> Actions -> Variables -> AWS_OIDC_ROLE_ARN to enable.
    # `vars.X` (not `secrets.X`) is required because job-level `if:`
    # cannot reference the secrets context.
    if: ${{ github.event_name == 'pull_request' && vars.AWS_OIDC_ROLE_ARN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./examples/basic

      - name: Terraform Plan
        run: terraform plan -no-color
        working-directory: ./examples/basic
        continue-on-error: true

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-validate, security-scan]
    # Manual dispatch only: required reviewers on the `production`
    # environment provide the second gate. Also gated on the OIDC
    # role variable being set.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.AWS_OIDC_ROLE_ARN != '' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./examples/basic

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./examples/basic

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./examples/basic

      - name: Get Organization Info
        run: |
          ORG_ID=$(terraform output -raw organization_id)
          MASTER_ACCOUNT_ID=$(terraform output -raw master_account_id)
          echo "Organization ID: $ORG_ID"
          echo "Master Account ID: $MASTER_ACCOUNT_ID"
        working-directory: ./examples/basic

  compliance-check:
    name: Compliance Check
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.AWS_OIDC_ROLE_ARN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Organization Status
        run: |
          echo "Checking AWS Organizations status..."
          aws organizations describe-organization || echo "Organization not found or not accessible"

      - name: Check Service Control Policies
        run: |
          echo "Listing Service Control Policies..."
          aws organizations list-policies --filter SERVICE_CONTROL_POLICY || echo "SCPs not accessible"

      - name: Check CloudTrail Status
        run: |
          echo "Checking CloudTrail status..."
          aws cloudtrail describe-trails --region ${{ env.AWS_REGION }} || echo "CloudTrail not accessible"
